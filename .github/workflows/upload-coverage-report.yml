name: Add code coverage summary to PRs

# Allows code coverage comments to be embedded in PRs if the build was run on a fork.

on:
  workflow_run:
    workflows: [ "ci-build" ]
    types:
      - completed

jobs:
  prCoverageComment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if:
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: 'Download coverage results'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-results

      - name: Add Code Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
